  </div>

{/* HISTORIAL */}
{vw==="historial"&&isA&&(()=>{
  const allMo=new Set([...Object.keys(me.byMo),...Object.keys(me.costByMo),...Object.keys(me.iMo)]);
  const months=[...allMo].sort();
  const hData=months.map(mo=>{const cob=me.byMo[mo]||0;const cm=me.costByMo[mo]||{equipo:0,tools:0,ads:0,total:0};const inv=me.iMo[mo]||0;const util=cob-cm.total;return{mo,cob,equipo:cm.equipo,tools:cm.tools,ads:cm.ads,costos:cm.total,util,inv}});
  return <div>
  <div style={{marginBottom:16}}>
    <div style={{fontSize:15,fontWeight:800}}>Historial <span style={{color:mt,fontWeight:400}}>P&L mes a mes · calculado en tiempo real</span></div>
  </div>
  {months.length===0?<div style={{textAlign:"center",padding:50,color:mt}}>Sin datos — registra pagos e inversiones para ver el historial.</div>:
  <div style={{background:cd,border:`1px solid ${bd}`,borderRadius:12,padding:"12px 0"}}>
    <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch",padding:"0 16px"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}><thead><tr style={{borderBottom:`2px solid ${bd}`}}>

        <th style={{textAlign:"right",padding:"8px 10px",color:mt,fontSize:9,fontWeight:700,fontFamily:"'Geist Mono',monospace"}}>ADS</th>
        <th style={{textAlign:"right",padding:"8px 10px",color:mt,fontSize:9,fontWeight:700,fontFamily:"'Geist Mono',monospace"}}>COSTOS</th>
        <th style={{textAlign:"right",padding:"8px 10px",color:mt,fontSize:9,fontWeight:800,fontFamily:"'Geist Mono',monospace"}}>UTILIDAD</th>

      </tr></thead><tbody>{hData.map(r=><tr key={r.mo} style={{borderBottom:`1px solid ${bd}`}}>
        <td style={{padding:10,fontWeight:700,fontFamily:"'Geist Mono',monospace",whiteSpace:"nowrap"}}>{MO[parseInt(r.mo.split("-")[1])-1]} {r.mo.split("-")[0]}</td>

        <td style={{textAlign:"right",padding:10,color:s2}}>{fm(r.equipo)}</td>
        <td style={{textAlign:"right",padding:10,color:s2}}>{fm(r.tools)}</td>
        <td style={{textAlign:"right",padding:10,color:s2}}>{fm(r.ads)}</td>
        <td style={{textAlign:"right",padding:10,fontWeight:700,color:"#f87171"}}>{fm(r.costos)}</td>
        <td style={{textAlign:"right",padding:10,fontWeight:800,fontSize:14,color:r.util>=0?tl:"#f47067"}}>{fm(r.util)}</td>
        <td style={{textAlign:"right",padding:10,color:s2}}>{fm(r.inv)}</td>
      </tr>)}</tbody>
      <tfoot><tr style={{borderTop:`2px solid ${bd}`,background:"rgba(78,205,196,.03)"}}>
        <td style={{padding:"12px 10px",fontWeight:800,fontSize:13}}>TOTAL</td>

        <td style={{textAlign:"right",padding:"12px 10px",color:s2}}>{fm(hData.reduce((s,r)=>s+r.tools,0))}</td>
        <td style={{textAlign:"right",padding:"12px 10px",color:s2}}>{fm(hData.reduce((s,r)=>s+r.ads,0))}</td>
        <td style={{textAlign:"right",padding:"12px 10px",fontWeight:700,color:"#f87171"}}>{fm(hData.reduce((s,r)=>s+r.costos,0))}</td>
        <td style={{textAlign:"right",padding:"12px 10px",fontWeight:800,color:hData.reduce((s,r)=>s+r.util,0)>=0?tl:"#f47067",fontSize:14}}>{fm(hData.reduce((s,r)=>s+r.util,0))}</td>
        <td style={{textAlign:"right",padding:"12px 10px",color:s2}}>{fm(hData.reduce((s,r)=>s+r.inv,0))}</td>

    </div>
  </div>}
  {hData.length>0&&<div style={{marginTop:16}}>
    <div className="g-cards">
      {(()=>{const last=hData[hData.length-1];const prev=hData.length>1?hData[hData.length-2]:null;
        const d=(k)=>prev?last[k]-prev[k]:0;const arr=(k)=>{const v=d(k);return v>0?"+"+fmShort(v):v<0?fmShort(v):"="};

        </div>)})()}
    </div>
  </div>}
</div>})()}

{/* STACK */}
{vw==="stack"&&!sub&&(<div>
  <div style={{display:"flex",gap:8,marginBottom:16,justifyContent:"space-between",alignItems:"center",flexWrap:"wrap"}}>

        <div><span style={{fontSize:10,color:mt}}>Inversor</span><div style={{fontSize:15,fontWeight:800,color:"#b392f0"}}>{fm(me.tlP.Inversor)}/mes</div></div>
        <div><span style={{fontSize:10,color:mt}}>Clientes</span><div style={{fontSize:15,fontWeight:800,color:"#56d4a0"}}>{fm(me.tlP.Cliente)}/mes</div></div>
      </div>
      {me.tlCov<100&&<div style={{marginTop:8,fontSize:11,color:s2}}>Faltan {fm(me.tlP.STRYV)}/mes por cubrir</div>}
      {me.tlCov>=100&&<div style={{marginTop:8,fontSize:11,color:s2}}>✓ Stack 100% cubierto</div>}
    </div>}
    <div className="g-auto">
      {tls.map(t=>{const _cm=new Date().toISOString().substring(0,7);const isCancelling=t.cancelDate&&t.status==="Activo";const isPast=t.cancelDate&&t.cancelDate.substring(0,7)<_cm;const stColor=isPast?"#f47067":isCancelling?"#e5a84b":t.status==="Activo"?tl:t.status==="Trial"?"#79b8ff":"#8b949e";const stLabel=isPast?"Cancelado":isCancelling?"Cancela pronto":t.status;return <div key={t.id} onClick={()=>{if(isA)ed(t,setTF,"stack","tF")}} style={{background:cd,border:`1px solid ${bd}`,borderRadius:12,padding:16,cursor:isA?"pointer":"default",overflow:"hidden",opacity:isPast?.55:1}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,gap:8}}>
          <div style={{minWidth:0,flex:1}}><div style={{fontSize:14,fontWeight:700}}>{t.name}</div><div style={{fontSize:10,color:tl,fontWeight:600}}>{t.category}</div></div>
          <span style={bg2(stColor)}>{stLabel}</span>
        </div>
        {isA?<div style={{minWidth:0}}>
          {t.url&&<div style={{fontSize:10,color:s2,marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%"}}>{t.url}</div>}
          {t.loginEmail&&<div style={{fontSize:9,color:mt,marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Login: {t.loginEmail}</div>}

          {isCancelling&&<div style={{fontSize:10,color:s2,marginBottom:4}}>{isPast?"⊘ Cancelado desde":"⏳ Se cancela el"} {t.cancelDate}</div>}

          <div style={{borderTop:`1px solid ${bd}`,paddingTop:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
            <div><span style={{fontSize:10,color:mt}}>{t.billing}</span><div style={{fontSize:14,fontWeight:800,color:t.billing==="Gratis"?"#56d4a0":tx}}>{t.billing==="Gratis"?"Gratis":fm(t.cost)}{t.billing==="Mensual"?"/mes":t.billing==="Anual"?"/año":""}</div>{t.currency==="MXN"&&<div style={{fontSize:8,color:mt}}>≈ {fmShort(toUSD(t.cost,t.currency))} USD</div>}</div>
            <div style={{textAlign:"right"}}><span style={{fontSize:9,color:mt}}>Paga:</span><div style={{fontSize:11,fontWeight:700,color:t.paidBy==="Cliente"?"#56d4a0":t.paidBy==="Inversor"?"#b392f0":"#ff7b72"}}>{t.paidBy==="Cliente"?t.paidByName||"Cliente":t.paidBy==="Inversor"?t.paidByName||"Inversor":"STRYV"}</div></div>
          </div>
        </div>:<div style={{borderTop:`1px solid ${bd}`,paddingTop:8,fontSize:10,color:mt}}>🔒 Restringido</div>}
      </div>})}
    </div>
  </div>}
</div>)}

{/* TOOL FORM */}

    <div><label style={lb}>Categoría</label><select value={tF.category} onChange={e=>setTF({...tF,category:e.target.value})} style={iS}>{TCATS.map(c=><option key={c}>{c}</option>)}</select></div>
  </div>
  <div className="g3" style={{marginBottom:16}}>

    <div><label style={lb}>Estado</label><select value={tF.status} onChange={e=>setTF({...tF,status:e.target.value})} style={iS}><option>Activo</option><option>Inactivo</option><option>Trial</option></select></div>
  </div>
  <div style={{marginBottom:16}}>
    <div><label style={lb}>Fecha de renovación</label><input value={tF.renewDate||""} onChange={e=>setTF({...tF,renewDate:e.target.value})} type="date" style={iS}/>{tF.renewDate&&(()=>{const rd=new Date(tF.renewDate+"T00:00:00");const diff=Math.ceil((rd-new Date())/(1000*60*60*24));return <div style={{fontSize:9,color:diff<=7?"#f47067":s2,marginTop:2}}>{diff<0?"Fecha pasada — actualizar":diff===0?"Renueva hoy":`Renueva en ${diff} día${diff!==1?"s":""}`}</div>})()}</div>
  </div>
  <div className="g2" style={{marginBottom:16}}>
    <div><label style={lb}>URL</label><input value={tF.url} onChange={e=>setTF({...tF,url:e.target.value})} style={iS}/></div>
    <div><label style={lb}>Email login</label><input value={tF.loginEmail} onChange={e=>setTF({...tF,loginEmail:e.target.value})} style={iS}/></div>
  </div>
  <div className="g2" style={{marginBottom:16}}>
    <div><label style={lb}>¿Quién paga?</label><select value={tF.paidBy||"STRYV"} onChange={e=>setTF({...tF,paidBy:e.target.value,paidByName:""})} style={iS}><option value="STRYV">STRYV</option><option value="Inversor">Inversor</option><option value="Cliente">Cliente</option></select></div>
    {tF.paidBy==="Cliente"&&<div><label style={lb}>¿Qué cliente?</label><select value={tF.paidByName||""} onChange={e=>setTF({...tF,paidByName:e.target.value})} style={iS}><option value="">—</option>{cl.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></div>}

  </div>
  <div style={{marginBottom:20}}><label style={lb}>Notas</label><textarea value={tF.notes} onChange={e=>setTF({...tF,notes:e.target.value})} rows={2} style={{...iS,resize:"vertical"}}/></div>
  <div className="mob-wrap" style={{display:"flex",gap:8}}>
    <button onClick={()=>sv("tools",tF,setTF,eT)} style={{background:tl,border:"none",color:bg,padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,fontWeight:700,cursor:"pointer"}}>{eid?"Guardar":"Agregar"}</button>
    <button onClick={()=>{setSub(null);setEid(null)}} style={{background:"transparent",border:`1px solid ${bd}`,color:s2,padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,cursor:"pointer"}}>Cancelar</button>

class EB extends React.Component{constructor(p){super(p);this.state={err:null}}static getDerivedStateFromError(e){return{err:e}}componentDidCatch(e,i){console.error("STRYV Error:",e,i)}render(){if(this.state.err)return <div style={{padding:40,textAlign:"center",color:"#ff6b6b",background:"#e8ecf2",minHeight:"100vh"}}><h2>Error en el dashboard</h2><pre style={{fontSize:12,color:"#374151",marginTop:16,textAlign:"left",maxWidth:600,margin:"16px auto",whiteSpace:"pre-wrap"}}>{this.state.err.toString()}</pre><button onClick={()=>this.setState({err:null})} style={{marginTop:16,background:"#4ECDC4",border:"none",color:"#fff",padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,fontWeight:700,cursor:"pointer"}}>Reintentar</button></div>;return this.props.children}}
ReactDOM.createRoot(document.getElementById("root")).render(<EB><App/></EB>);
