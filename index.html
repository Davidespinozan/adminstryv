/* ══════════════════════════════════════════════════════════════════════════
   CONSOLIDADO — los 4 negocios del grupo en una vista.
   ──────────────────────────────────────────────────────────────────────────
   Los datos NO se leen desde acá: los trae la función `consolidado` del lado
   del servidor, que es la única con las claves de servicio de cada negocio.
   Si esas claves vivieran en este archivo, cualquiera que abra el panel se
   llevaría las llaves maestras de los tres proyectos.

   REGLA DE ESTA VISTA: nunca inventar un número. Si un negocio todavía no
   puede medir algo, se muestra "—" y se explica abajo. Un cero se lee como
   "vendiste nada"; el guion se lee como "no lo sabemos".
   ══════════════════════════════════════════════════════════════════════════ */
const NEGOCIOS_GRUPO=[{id:"sala",l:"SALA Studio"},{id:"hsc",l:"Healthy Space Club"},{id:"healthyspace",l:"Healthy Space"},{id:"stryv",l:"Stryv (clientes)"}];

function Consolidado(){
  const[dat,setDat]=React.useState(null);
  const[err,setErr]=React.useState(null);
  const[load,setLoad]=React.useState(true);

  const cargar=React.useCallback(async()=>{
    setLoad(true);setErr(null);
    try{
      const{data:{session}}=await SB.auth.getSession();
      if(!session){setErr("Sesión vencida. Volvé a entrar.");setLoad(false);return}
      const r=await fetch("/.netlify/functions/consolidado",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:"{}"});
      const j=await r.json().catch(()=>({}));
      /* Se muestra el motivo real del servidor (falta configurar, sin permiso,
         sesión vencida) y no un "algo salió mal" que no ayuda a arreglarlo. */
      if(!r.ok)throw new Error(j.error||("Error "+r.status));
      setDat(j);
    }catch(e){setErr(e.message||"No se pudo cargar")}
    finally{setLoad(false)}
  },[]);
  React.useEffect(()=>{cargar()},[cargar]);

  if(load)return <div style={{padding:40,textAlign:"center",color:mt,fontFamily:ibm,fontSize:13}}>Cargando los negocios…</div>;
  if(err)return(
    <div style={{background:cd,border:"1px solid "+bd,borderRadius:16,padding:24}}>
      <div style={{color:"#f87171",fontWeight:600,fontFamily:ibm,fontSize:13,marginBottom:10}}>{err}</div>
      <button onClick={cargar} style={{background:tl,color:"#fff",border:"none",borderRadius:10,padding:"9px 16px",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:ibm}}>Reintentar</button>
    </div>
  );

  const mes=new Date().toISOString().substring(0,7);
  const filas=NEGOCIOS_GRUPO.map(n=>{
    const d=(dat.negocios||{})[n.id]||{movimientos:[],eventos:[],huecos:["Sin datos"]};
    const movs=d.movimientos||[];
    const delMes=movs.filter(m=>(m.ocurrido_en||"").substring(0,7)===mes);
    /* null = ese negocio no registra montos todavía. Distinto de 0. */
    const ing=movs.length?delMes.reduce((s,m)=>s+(m.monto_centavos||0),0)/100:null;
    return{...n,ing,huecos:d.huecos||[],snap:d.snapshot||null};
  });
  const total=filas.reduce((s,f)=>s+(f.ing||0),0);
  const medibles=filas.filter(f=>f.ing!==null).length;

  return(
    <div>
      <div style={{...hd,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>Los 4 negocios · {fm(total)} este mes</span>
        <button onClick={cargar} style={{background:"transparent",border:"1px solid "+bd,borderRadius:10,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:ibm,color:s2,letterSpacing:0,textTransform:"none"}}>Actualizar</button>
      </div>

      <div style={{fontSize:12,color:mt,fontFamily:ibm,marginBottom:16,marginLeft:12}}>
        Suma de {medibles} de {filas.length} negocios · el resto todavía no puede medir sus ingresos
      </div>

      <div className="g-cards" style={{marginBottom:16}}>
        {filas.map(f=>(
          <div key={f.id} className="card-row" style={{background:cd,border:"1px solid "+bd,borderRadius:16,padding:"20px 24px"}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:".22em",textTransform:"uppercase",color:mt,marginBottom:10,fontFamily:ibm}}>{f.l}</div>
            <div style={{fontSize:18,fontWeight:700,color:f.ing===null?mt:"#34d399",letterSpacing:"-.02em",fontFamily:dsp,lineHeight:1}}>
              {f.ing===null?"—":fm(f.ing)}
            </div>
            {f.snap&&(
              <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid "+bd,display:"grid",gap:4}}>
                {Object.entries(f.snap).filter(e=>typeof e[1]==="number").map(e=>(
                  <div key={e[0]} style={{display:"flex",justifyContent:"space-between",fontSize:11.5,fontFamily:ibm,color:s2}}>
                    <span>{e[0].replace(/_/g," ")}</span><b style={{color:tx}}>{e[1]}</b>
                  </div>
                ))}
              </div>
            )}
            {f.huecos.length>0&&(
              <details style={{marginTop:12}}>
                <summary style={{cursor:"pointer",fontSize:11,fontWeight:600,color:tl,fontFamily:ibm}}>
                  {f.huecos.length} {f.huecos.length===1?"hueco":"huecos"} de medición
                </summary>
                <ul style={{margin:"8px 0 0",paddingLeft:16,fontSize:11.5,color:s2,fontFamily:ibm,lineHeight:1.5}}>
                  {f.huecos.map((h,i)=><li key={i} style={{marginBottom:4}}>{h}</li>)}
                </ul>
              </details>
            )}
          </div>
        ))}
      </div>

      <div style={{fontSize:11.5,color:mt,fontFamily:ibm,marginLeft:12}}>
        <b>—</b> significa <b>no medible todavía</b>, no cero. Cada hueco se cierra instrumentando ese negocio.
      </div>
    </div>
  );
}

const _dateKeys=new Set(["cancel_date","renew_date","start_date","deadline","est_delivery","scheduled_date","date"]);
const toSn=o=>{const r={};for(const k in o){const sk=k.replace(/([A-Z])/g,"_$1").toLowerCase();const v=o[k];r[sk]=_dateKeys.has(sk)&&v===""?null:v}return r};
const toCa=o=>{if(!o)return o;const r={};for(const k in o)r[k.replace(/_([a-z])/g,(_,l)=>l.toUpperCase())]=o[k];return r};
const toCaA=a=>(a||[]).map(toCa);
const _counts={};
async function dSel(t){
  let q=SB.from(t).select("*",{count:"exact"});
  if(_softDelTables.includes(t))q=q.is("deleted_at",null);
  q=q.order("created_at",{ascending:t!=="prospects"}).limit(5000);
  const{data,error,count}=await q;
  _counts[t]=count||0;
  return error?[]:toCaA(data);
}
async function dIns(t,row){const c={...toSn(row)};delete c.id;delete c.created_at;delete c.updated_at;const{data,error}=await SB.from(t).insert(c).select();if(error){console.error("INSERT error",t,error.message,error.details,error.hint,c);alert("Error DB: "+error.message);return null}return toCa(data[0])}
async function dUpd(t,id,row){const c={...toSn(row)};delete c.id;delete c.created_at;delete c.updated_at;const{data,error}=await SB.from(t).update(c).eq("id",id).select();if(error){console.error("UPDATE error",t,error.message,error.details,error.hint,c);alert("Error DB: "+error.message);return null}return toCa(data[0])}
const _softDelTables=["clients","team","tools","projects","investments"];
async function dDel(t,id){
  if(_softDelTables.includes(t)){
    const{data,error}=await SB.from(t).update({deleted_at:new Date().toISOString()}).eq("id",id).select();
    if(error||!data||data.length===0){
      console.warn("soft delete failed, trying hard delete",t,error);
      const{error:e2}=await SB.from(t).delete().eq("id",id);
      if(e2){console.error("hard delete error",t,e2);alert("Error al eliminar: "+e2.message);return false}
    }
    return true;
  }else{
    const{error}=await SB.from(t).delete().eq("id",id);
    if(error){console.error("delete error",t,error);alert("Error al eliminar: "+error.message);return false}
    return true;
  }
}

          {t.renewDate&&t.status==="Activo"&&!isPast&&(()=>{const rd=new Date(t.renewDate+"T00:00:00");const now=new Date();const diff=Math.ceil((rd-now)/(1000*60*60*24));const urgent=diff<=7&&diff>=0;const past=diff<0;return <div style={{fontSize:10,color:urgent?"#f47067":s2,marginBottom:4}}>{past?"↻ Renovar fecha":urgent?`Renueva en ${diff} día${diff!==1?"s":""}`:diff<=30?`↻ Renueva en ${diff} días`:"↻ Renueva el"} {!past&&t.renewDate}</div>})()}
          <div style={{borderTop:`1px solid ${bd}`,paddingTop:8,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
            <div><span style={{fontSize:10,color:mt}}>{t.billing}</span><div style={{fontSize:14,fontWeight:800,color:t.billing==="Gratis"?"#56d4a0":tx}}>{t.billing==="Gratis"?"Gratis":fm(t.cost)}{t.billing==="Mensual"?"/mes":t.billing==="Anual"?"/año":""}</div>{t.currency==="MXN"&&<div style={{fontSize:8,color:mt}}>≈ {fmShort(toUSD(t.cost,t.currency))} USD</div>}</div>
            <div style={{textAlign:"right"}}><span style={{fontSize:9,color:mt}}>Paga:</span><div style={{fontSize:11,fontWeight:700,color:t.paidBy==="Cliente"?"#56d4a0":t.paidBy==="Inversor"?"#b392f0":"#ff7b72"}}>{t.paidBy==="Cliente"?t.paidByName||"Cliente":t.paidBy==="Inversor"?t.paidByName||"Inversor":"STRYV"}</div></div>
          </div>
        </div>:<div style={{borderTop:`1px solid ${bd}`,paddingTop:8,fontSize:10,color:mt}}>🔒 Restringido</div>}
      </div>})}
    </div>
  </div>}
</div>)}

{/* TOOL FORM */}
{vw==="stack"&&sub==="tF"&&(<div style={{maxWidth:600,width:"100%"}}>
  <div style={{fontSize:17,fontWeight:800,marginBottom:20}}>{eid?"Editar":"Nueva herramienta"}</div>

  </div>
  <div className="g3" style={{marginBottom:16}}>
    <div><label style={lb}>Costo</label><div style={{display:"flex",gap:4}}><input value={tF.cost} onChange={e=>setTF({...tF,cost:e.target.value})} type="number" style={{...iS,flex:1}}/><CurSel val={tF.currency} onChange={v=>setTF({...tF,currency:v})}/></div>{tF.currency==="MXN"&&<div style={{fontSize:8,color:mt,marginTop:2}}>≈ {fmShort(toUSD(tF.cost,tF.currency))} USD</div>}</div>
    <div><label style={lb}>Ciclo</label><select value={tF.billing} onChange={e=>setTF({...tF,billing:e.target.value})} style={iS}>{BILL.map(b=><option key={b}>{b}</option>)}</select></div>
    <div><label style={lb}>Estado</label><select value={tF.status} onChange={e=>setTF({...tF,status:e.target.value})} style={iS}><option>Activo</option><option>Inactivo</option><option>Trial</option></select></div>
  </div>
  <div style={{marginBottom:16}}>
    <div><label style={lb}>Fecha de renovación</label><input value={tF.renewDate||""} onChange={e=>setTF({...tF,renewDate:e.target.value})} type="date" style={iS}/>{tF.renewDate&&(()=>{const rd=new Date(tF.renewDate+"T00:00:00");const diff=Math.ceil((rd-new Date())/(1000*60*60*24));return <div style={{fontSize:9,color:diff<=7?"#f47067":s2,marginTop:2}}>{diff<0?"Fecha pasada — actualizar":diff===0?"Renueva hoy":`Renueva en ${diff} día${diff!==1?"s":""}`}</div>})()}</div>
  </div>
  <div className="g2" style={{marginBottom:16}}>
    <div><label style={lb}>URL</label><input value={tF.url} onChange={e=>setTF({...tF,url:e.target.value})} style={iS}/></div>
    <div><label style={lb}>Email login</label><input value={tF.loginEmail} onChange={e=>setTF({...tF,loginEmail:e.target.value})} style={iS}/></div>
  </div>
  <div className="g2" style={{marginBottom:16}}>
    <div><label style={lb}>¿Quién paga?</label><select value={tF.paidBy||"STRYV"} onChange={e=>setTF({...tF,paidBy:e.target.value,paidByName:""})} style={iS}><option value="STRYV">STRYV</option><option value="Inversor">Inversor</option><option value="Cliente">Cliente</option></select></div>
    {tF.paidBy==="Cliente"&&<div><label style={lb}>¿Qué cliente?</label><select value={tF.paidByName||""} onChange={e=>setTF({...tF,paidByName:e.target.value})} style={iS}><option value="">—</option>{cl.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select></div>}
    {tF.paidBy==="Inversor"&&<div><label style={lb}>¿Qué inversor?</label><select value={tF.paidByName||""} onChange={e=>setTF({...tF,paidByName:e.target.value})} style={iS}><option value="">—</option>{tm.filter(m=>(m.roles||[]).includes("Inversionista")).map(m=><option key={m.id} value={m.name}>{m.name}</option>)}</select></div>}
  </div>
  <div style={{marginBottom:20}}><label style={lb}>Notas</label><textarea value={tF.notes} onChange={e=>setTF({...tF,notes:e.target.value})} rows={2} style={{...iS,resize:"vertical"}}/></div>
  <div className="mob-wrap" style={{display:"flex",gap:8}}>
    <button onClick={()=>sv("tools",tF,setTF,eT)} style={{background:tl,border:"none",color:bg,padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,fontWeight:700,cursor:"pointer"}}>{eid?"Guardar":"Agregar"}</button>
    <button onClick={()=>{setSub(null);setEid(null)}} style={{background:"transparent",border:`1px solid ${bd}`,color:s2,padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,cursor:"pointer"}}>Cancelar</button>
    {eid&&isA&&<button onClick={()=>dl("tools",eid)} style={{background:"rgba(255,107,107,.1)",border:"1px solid rgba(255,107,107,.3)",color:"#ff6b6b",padding:"12px 18px",borderRadius:8,fontSize:12,minHeight:44,cursor:"pointer",marginLeft:"auto"}}>Eliminar</button>}
  </div>
</div>)}

</div>
</div>);
}
class EB extends React.Component{constructor(p){super(p);this.state={err:null}}static getDerivedStateFromError(e){return{err:e}}componentDidCatch(e,i){console.error("STRYV Error:",e,i)}render(){if(this.state.err)return <div style={{padding:40,textAlign:"center",color:"#ff6b6b",background:"#e8ecf2",minHeight:"100vh"}}><h2>Error en el dashboard</h2><pre style={{fontSize:12,color:"#374151",marginTop:16,textAlign:"left",maxWidth:600,margin:"16px auto",whiteSpace:"pre-wrap"}}>{this.state.err.toString()}</pre><button onClick={()=>this.setState({err:null})} style={{marginTop:16,background:"#4ECDC4",border:"none",color:"#fff",padding:"12px 24px",borderRadius:8,fontSize:13,minHeight:44,fontWeight:700,cursor:"pointer"}}>Reintentar</button></div>;return this.props.children}}
ReactDOM.createRoot(document.getElementById("root")).render(<EB><App/></EB>);
